syntax = "proto3";
option java_multiple_files = true;
option java_package = "dk.via.wom.grpc";
package wom;

message Cow { string id=1; string name=2; string date_of_birth=3; string health=4; string department=5; }
message AddCowRequest { Cow cow=1; }
message AddCowReply { string id=1; }

service CowService {
  rpc AddCow(AddCowRequest) returns (AddCowReply);
}
